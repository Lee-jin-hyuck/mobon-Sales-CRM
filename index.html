<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOBON CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--muted:#666;--line:#ddd;--line2:#eee;--bg:#f5f6f7;--panel:#fff;--accent:#1F7A4D;--accent2:#e8f3ec;--warn:#b54708;--danger:#b42318;--gray:#B6BDC4;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:13px;color:var(--ink);background:var(--bg);word-break:keep-all}
a{color:#0b5cad;text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:#fff;border:1px solid #bbb;border-radius:4px;padding:5px 11px}
button:hover{background:#f2f2f2}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.primary:hover{background:#176240}
button.danger{color:var(--danger);border-color:#e3b1ad}
button.small{padding:2px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],input[type=email],select,textarea{border:1px solid #bbb;border-radius:4px;padding:5px 8px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #cfe5d8;border-color:var(--accent)}
.hidden{display:none!important}
/* layout */
#top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;position:sticky;top:0;z-index:20}
#top .brand{font-weight:700;letter-spacing:.5px}
#top nav{display:flex;gap:2px;height:100%}
#top nav a{display:flex;align-items:center;padding:0 12px;color:#333;border-bottom:3px solid transparent}
#top nav a.active{border-bottom-color:var(--accent);font-weight:500;color:var(--ink)}
#top nav a:hover{text-decoration:none;background:#f7f7f7}
#top .spacer{flex:1}
#gsearch{width:280px;position:relative}
#gsearch input{padding-left:28px}
#gsearch .ico{position:absolute;left:9px;top:7px;color:#888}
#gsResults{position:absolute;top:34px;left:0;width:520px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:60vh;overflow:auto;z-index:30}
#gsResults .grp{padding:6px 10px;background:#f2f2f2;font-weight:500;font-size:12px}
#gsResults .it{padding:6px 10px;cursor:pointer;display:flex;gap:8px}#gsResults .it:hover{background:#eef6f1}
#gsResults .it .sub{color:var(--muted)}
#me{color:var(--muted)}
#main{padding:16px 20px;max-width:1600px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.page-head h1{font-size:18px;margin:0;font-weight:700}
.page-head .sub{color:var(--muted)}
.page-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 10px 0;font-weight:700}
.panel h2 .cnt{color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
/* tables */
table.grid{border-collapse:collapse;width:100%;background:#fff}
table.grid th,table.grid td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;vertical-align:top}
table.grid th{background:#f2f2f2;font-weight:500;position:sticky;top:0;z-index:2}
table.grid th.sortable{cursor:pointer}
table.grid td.num,table.grid th.num{text-align:right}
table.grid tr:hover td{background:#fafcfb}
table.grid td.wrap{white-space:normal;min-width:180px}
.tblwrap{overflow:auto;max-height:calc(100vh - 200px);border:1px solid var(--line);background:#fff}
.tblwrap table.grid{border:0}
.panel table.grid th,#modal table.grid th{top:0}
tr.subtotal td{background:#f7f7f7;font-weight:500}
tr.total td{background:#ececec;font-weight:700}
.rowlink{cursor:pointer}
/* filter bar */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input[type=search]{width:220px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfd8dc;background:#f7f9fa;border-radius:14px;padding:2px 10px;font-size:12px}
.chip b{font-weight:500}
.chip .x{cursor:pointer;color:#888}
/* forms */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.frm .sec{grid-column:1/-1;font-weight:700;border-bottom:1px solid var(--line);padding:8px 0 4px;margin-top:6px}
.frm .f label{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.frm .f.full{grid-column:1/-1}
.req::after{content:" *";color:var(--danger)}
.err{color:var(--danger);font-size:12px}
/* detail */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.dl .row{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid var(--line2);padding:5px 0;min-height:30px}
.dl .row .k{color:var(--muted)}
.dl .row .v{white-space:pre-wrap}
.dl .sec{grid-column:1/-1;font-weight:700;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.hero{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.hero .h{font-size:20px;font-weight:700}
.hero .k{color:var(--muted);font-size:12px}
.hero .kv{display:flex;flex-direction:column}
/* path */
.path{display:flex;gap:4px;margin:6px 0 12px}
.path .st{flex:1;padding:8px 10px;background:#eceff1;text-align:center;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);user-select:none}
.path .st.done{background:#c8e6d3}
.path .st.cur{background:var(--accent);color:#fff;font-weight:500}
.path .st.lost{background:#e0e0e0}
.path .st.cur.lost{background:#555}
.path .st.closed{background:#e3e8ec;font-weight:500}.path .st.closed.won{background:#1f4f8f;color:#fff}.path .st.closed.lost{background:#555;color:#fff}
/* timeline */
.tl .it{border-left:3px solid var(--line);padding:4px 10px;margin:0 0 8px 6px}
.tl .it.open{border-color:#f0b429}.tl .it.done{border-color:var(--accent)}
.tl .it .t{font-weight:500}
.tl .it .m{color:var(--muted);font-size:12px}
.tl .mon{font-weight:700;margin:10px 0 6px;color:#444}
/* modal */
#modal2{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:70;overflow:auto;padding:60px 12px}
#modal2 .box{background:#fff;border-radius:8px;width:min(560px,100%);padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal2 h2{margin:0 0 12px;font-size:16px}
#modal2 .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 12px}
#modal .box{background:#fff;border-radius:8px;width:min(920px,100%);padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal .box.narrow{width:min(520px,100%)}
#modal .box.wide{width:min(1200px,100%)}
#modal h2{margin:0 0 12px;font-size:16px}
#modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:6px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dash .w{min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:0;height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
.dash .w.c2{grid-column:span 2}.dash .w.c3{grid-column:span 3}.dash .w.c4{grid-column:span 4}
.dash .w .wt{font-weight:700;display:flex;align-items:center;gap:6px}
.dash .w .wt .sp{flex:1}
.dash .w .wb{flex:1;position:relative;overflow:auto;margin-top:6px;min-height:0}
.dash .w .wf{color:var(--muted);font-size:11px;margin-top:6px}
.dash .w .big{font-size:34px;font-weight:700;text-align:center;padding:30px 0}
.dash .w table.grid th{top:0;font-size:12px}
.dash .w table.grid td{font-size:12px}
/* 보고서 실행 (Lightning 스타일 표) */
.rrh .sub{color:var(--muted);font-size:12px}
.rrsum{display:flex;gap:28px;padding:10px 14px;border:1px solid var(--line);border-bottom:0;background:#fff}.rrsum .kpi .k{font-size:11px;color:var(--muted)}.rrsum .kpi .v{font-size:18px;font-weight:600;color:#1a3d6b}
.tblwrap.rr{max-height:calc(100vh - 300px)}
table.grid.rg th{white-space:nowrap;position:relative;padding-right:22px}table.grid.rg th .sm{color:#555;font-weight:400}table.grid.rg th .hm{position:absolute;right:6px;top:50%;transform:translateY(-50%);cursor:pointer;color:#666;border:1px solid #bbb;border-radius:3px;font-size:10px;line-height:14px;padding:0 3px;background:#fff}table.grid.rg th .hm:hover{background:#eef6f1;border-color:var(--accent)}
table.grid.rg.sum{width:auto;min-width:0}
table.grid.rg td.gcell{vertical-align:top;background:#fafafa;font-weight:500;white-space:nowrap;border-right:1px solid var(--line)}table.grid.rg td.gcell .gc{color:var(--muted);font-weight:400}
table.grid.rg tr.subtotal td{background:#f3f4f6;font-weight:500}table.grid.rg tr.g1sub td{background:#e9ebee;font-weight:600}table.grid.rg tr.total td{background:#e3e8ec;font-weight:700}
.rrfoot{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-top:0;padding:8px 14px;display:flex;gap:22px;align-items:center;font-size:13px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.sw input{display:none}.sw .track{width:34px;height:18px;border-radius:9px;background:#c7ccd1;position:relative;transition:.15s}.sw .track:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:.15s}.sw input:checked+.track{background:var(--accent)}.sw input:checked+.track:after{left:18px}
.ctxmenu{position:fixed;z-index:90;background:#fff;border:1px solid #bbb;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:200px;padding:4px 0;font-size:13px}.ctxmenu .it{padding:6px 12px;cursor:pointer}.ctxmenu .it:hover{background:#eef6f1}.ctxmenu .it.sub{padding-left:22px}.ctxmenu .it.on{font-weight:600}.ctxmenu .sep{border-top:1px solid var(--line);margin:4px 0}.ctxmenu .subh{padding:5px 12px 2px;font-size:11px;color:var(--muted)}
.chip .x{cursor:pointer;margin-left:6px}
/* 대시보드 (Lightning 스타일) */
.dash{grid-auto-rows:300px}
.dash .w{position:relative;padding:8px 12px 8px}
.dash .w.r2{grid-row:span 2}
.dash .w .wt{font-weight:700;display:flex;align-items:flex-start;gap:6px;font-size:13px}.dash .w .wtt{display:flex;flex-direction:column;min-width:0}.dash .w .wtt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dash .w .wtt .st{font-weight:400;color:var(--muted);font-size:11px}
.dash .w .ic{cursor:pointer;color:#8a949c;font-size:13px;padding:0 3px;line-height:18px}.dash .w .ic:hover{color:var(--accent)}
.dash .w .wf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dash .w .wf .ts{margin-left:auto}.dash .w .wf .ft{color:#555}
.dash .w .rz{position:absolute;right:2px;bottom:0;cursor:nwse-resize;color:#aab;font-size:12px;padding:2px 4px;user-select:none}.dash .w .rz:hover{color:var(--accent)}
.dash.editing .w[draggable]{cursor:grab}.dash.editing .w.drag{opacity:.5}.dash.editing .w.over{outline:2px dashed var(--accent);outline-offset:-2px}.dash.editing .w.resizing{outline:2px solid var(--accent);outline-offset:-2px}
.dash .w.add{border:2px dashed #c9d2cc;background:#fafcfb;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--accent);font-weight:500;min-height:160px}.dash .w.add:hover{background:#eef6f1}
.dash.one{grid-template-columns:1fr}.dash.one .w{min-height:300px}
.dbh .sub{color:var(--muted);font-size:12px;margin-top:2px}
.we{display:grid;grid-template-columns:380px 1fr;gap:18px}.we .wel{max-height:70vh;overflow:auto;padding-right:8px;border-right:1px solid var(--line)}.we .wer{min-width:0}
.wtypes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.wtypes .wty{border:1px solid var(--line);border-radius:4px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center}.wtypes .wty .g{font-size:16px;line-height:18px}.wtypes .wty:hover{background:#f3f6f4}.wtypes .wty.on{border-color:var(--accent);background:#eef6f1;font-weight:500}.wtypes .wty.on.dim{border-style:dashed}
#modal2 .box.wide{width:min(900px,100%)}
.rpk{padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}.rpk:hover{background:#f5f7f6}.rpk.sel{background:#eef6f1}.rpk b{font-weight:500}.rpk .muted{font-size:12px}
@media(max-width:900px){.we{grid-template-columns:1fr}.we .wel{border-right:0;max-height:none}}
@media(max-width:1100px){.dash{grid-template-columns:repeat(2,1fr)}.dash .w.c3,.dash .w.c4{grid-column:span 2}}
/* lookup */
.lkwrap{position:relative}
.lkdd{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #bbb;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:260px;overflow:auto;z-index:60}
.lkdd .o{padding:6px 10px;cursor:pointer;display:flex;flex-direction:column}
.lkdd .o:hover,.lkdd .o.act{background:#eef6f1}
.lkdd .o b{font-weight:500}
.lkdd .o .s{color:var(--muted);font-size:12px}
.lkdd .none{padding:8px 10px;color:var(--muted)}
.lkdd .add{padding:7px 10px;cursor:pointer;border-top:1px solid var(--line2);color:var(--accent);font-weight:500}.lkdd .add:hover{background:#eef6f1}
/* misc */
.tag{display:inline-block;padding:1px 7px;border-radius:10px;background:#eee;font-size:11px}
.tag.g{background:#dff1e6;color:#175a3a}.tag.r{background:#f5dcdc;color:#7a1f1f}.tag.y{background:#fdf0c9;color:#7a5200}
.muted{color:var(--muted)}
.right{text-align:right}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.inline{display:inline-flex;gap:6px;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs a{padding:7px 12px;border-bottom:3px solid transparent;color:#444;cursor:pointer}
.tabs a.active{border-bottom-color:var(--accent);font-weight:500;color:var(--ink)}
.split{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.lst .it{padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.lst .it:hover,.lst .it.sel{background:#eef6f1}
.help{color:var(--muted);font-size:12px;margin-top:4px}
#login{max-width:380px;margin:80px auto;background:#fff;padding:26px 30px;border:1px solid var(--line);border-radius:8px}
#login h1{font-size:18px;margin:0 0 16px}
#login .f{margin-bottom:10px}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dropzone{border:2px dashed #bbb;padding:24px;text-align:center;color:var(--muted);border-radius:6px}
pre.code{background:#f4f4f4;border:1px solid var(--line);padding:8px;overflow:auto;font-size:12px}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.sortlist li{list-style:none;border:1px solid var(--line);padding:4px 8px;margin:3px 0;background:#fff;display:flex;gap:8px;align-items:center}
.sortlist{padding:0;margin:0}
/* 보고서 만들기 / 빌더 (Lightning 스타일) */
.rtp{display:grid;grid-template-columns:200px 1fr 300px;min-height:480px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rtp .cats{border-right:1px solid var(--line);background:#fafafa;padding:6px 0}.rtp .cats .ch{font-weight:600;padding:6px 14px;font-size:13px}
.rtp .cats a{display:block;padding:7px 14px;cursor:pointer;border-left:3px solid transparent;font-size:13px}.rtp .cats a:hover{background:#f0f0f0}.rtp .cats a.active{border-left-color:var(--accent);background:#eef6f1;font-weight:500}
.rtp .list{padding:12px 14px;overflow:auto;max-height:70vh}.rtp .list .lh{font-weight:600;margin-bottom:8px}.rtp .list input{width:100%;margin-bottom:8px}
.rtp .list tr.rt{cursor:pointer}.rtp .list tr.rt:hover td{background:#f5f7f6}.rtp .list tr.rt.sel td{background:#eef6f1}
.rtp .det{border-left:1px solid var(--line);padding:12px 14px;overflow:auto;max-height:70vh}.rtp .det .dh{font-weight:600;margin-bottom:10px}.rtp .det .dt{margin-bottom:10px}.rtp .det .sh{font-weight:600;margin:12px 0 6px;font-size:13px}.rtp .det .rlink{margin-bottom:6px;font-size:13px}.rtp .det .fld{padding:2px 0;font-size:13px}
.rbh .rb-title{display:flex;align-items:center;gap:8px}.rbh .rb-title input{font-size:20px;font-weight:600;border:1px solid transparent;padding:2px 6px;max-width:60vw;background:transparent}.rbh .rb-title input:hover,.rbh .rb-title input:focus{border-color:var(--line);background:#fff}.rbh .pen{cursor:pointer;color:#888}
.rb2{display:grid;grid-template-columns:320px 1fr;gap:0;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:70vh}
.rb2 .pane{border-right:1px solid var(--line);padding:10px 12px;overflow:auto;max-height:calc(100vh - 150px);position:sticky;top:60px}
.rb2 .pane .tabs{margin-bottom:10px}.rb2 .pane .tabs a{flex:1;text-align:center}.rb2 .badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:16px;text-align:center}.rb2 .badge:empty{display:none}
.rb2 .sec{border-bottom:1px solid var(--line2);padding:8px 0 12px;margin-bottom:6px}.rb2 .sec h3{font-size:13px;margin:0 0 6px;font-weight:600}.rb2 .sec h3 .help{font-weight:400}
.rb2 .lkwrap input{width:100%}.rb2 .lkdd .gh{padding:6px 10px 2px;font-size:11px;color:var(--muted);font-weight:600}
.rb2 .gcard{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-top:6px;background:#fafafa}.rb2 .gcard .lv{display:inline-block;width:18px;height:18px;border-radius:9px;background:#e6eeea;color:#175a3a;font-size:11px;text-align:center;line-height:18px}.rb2 .gcard b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rb2 .gcard select{font-size:12px}
.rb2 .x{cursor:pointer;color:#999;padding:0 4px}.rb2 .x:hover{color:#b00}
.rb2 .sortlist li{margin:4px 0;padding:5px 6px;cursor:grab}.rb2 .sortlist li.over{border-color:var(--accent);background:#eef6f1}.rb2 .sortlist .grip{color:#bbb;font-size:11px}.rb2 .sortlist button.small{padding:0 5px}
.rb2 .fcard{border:1px solid var(--line);border-radius:4px;padding:7px 9px;margin-top:8px;position:relative;cursor:pointer;background:#fff}.rb2 .fcard:hover{border-color:#9bb}.rb2 .fcard .fl{font-size:11px;color:var(--muted)}.rb2 .fcard .fv{font-size:13px;margin-top:2px;padding-right:18px}.rb2 .fcard .fe-x{position:absolute;right:4px;top:8px}
.rb2 .fcard.fixed{cursor:default;background:#fafafa}.rb2 .fcard.fixed select{width:100%;margin-top:4px}
.rb2 .fcard.edit{cursor:default;border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}.rb2 .fcard.edit select,.rb2 .fcard.edit input{width:100%}.rb2 .fcard.edit .fe-val{margin-top:6px}.rb2 .fcard.edit .fb{display:flex;gap:6px;margin-top:8px}
.rb2 .prev{padding:10px 14px;overflow:auto;min-width:0}.rb2 .prev .note{font-size:12px;color:#444;padding:6px 8px;background:#f5f7f6;border-radius:4px;margin-bottom:8px}.rb2 .prev .note .ok{color:#1f7a4d}
.rb2 .prev table.grid th{top:0}.rb2 .rbchart{margin-bottom:12px}.rb2 .rbchart{height:280px}

function $(s,el){ return (el||document).querySelector(s); }
function $$(s,el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n = parseFloat(String(v==null?'':v).replace(/[,₩%\s]/g,'')); return isNaN(n)?0:n; }
function fmtMoney(v){ if(v===''||v==null) return ''; return '₩'+Math.round(num(v)).toLocaleString('ko-KR'); }
function fmtNum(v){ if(v===''||v==null) return ''; return num(v).toLocaleString('ko-KR'); }
function fmtDate(v){ if(!v) return ''; return String(v).slice(0,10).replace(/-/g,'. ').replace(/(\d{4})\. (\d{2})\. (\d{2})/,'$1. $2. $3.'); }
function fmtDT(v){ if(!v) return ''; return String(v).replace('T',' ').slice(0,16); }
function nowLocal(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function ym(d){ return String(d||'').slice(0,7); }
function isTrue(v){ return v===true||v==='TRUE'||v==='true'||v===1||v==='1'; }
function uid(prefix){ return (prefix||'x')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function fieldDef(t,k){ var s = SCHEMA[t]||EXTRA_SCHEMA[t]; var f = s && s.fields.filter(function(f){ return f.k===k; })[0]; if(f) return f; return SYS_FIELDS.filter(function(f){ return f.k===k; })[0] || {k:k,label:k,type:'text'}; }
function allFields(t){ var s = SCHEMA[t]||EXTRA_SCHEMA[t]; return (s?s.fields.filter(function(f){ return f.k; }):[]).concat(SYS_FIELDS); }
function fmtVal(t,k,v,rec){
  var f = fieldDef(t,k);
  if(k==='what_id' && rec) return nameOf(rec.what_type||'accounts',v);
  switch(f.type){
    case 'currency': return fmtMoney(v);
    case 'number': return fmtNum(v);
    case 'percent': return v===''||v==null?'':num(v)+'%';
    case 'date': return fmtDate(v);
    case 'datetime': return fmtDT(v);
    case 'check': return isTrue(v)?'✔':'';
    case 'lookup': var tb = f.table||(rec&&rec[f.tableFrom]); return nameOf(tb,v);
    case 'user': return userName(v);
    default: if(f.labels&&f.labels[v]) return f.labels[v]; return v==null?'':String(v);
  }
}
function linkVal(t,k,v,rec){ // 상세 링크 포함 표시
  var f = fieldDef(t,k);
  if(f.type==='lookup'){ var tb = f.table||(rec&&rec[f.tableFrom]); if(v&&get(tb,v)) return '<a href="#/'+tb+'/'+esc(v)+'">'+esc(nameOf(tb,v))+'</a>'; }
  if(k==='what_id'&&rec&&v&&get(rec.what_type,v)) return '<a href="#/'+rec.what_type+'/'+esc(v)+'">'+esc(nameOf(rec.what_type,v))+'</a>';
  if(k==='who_id'&&v&&get('contacts',v)) return '<a href="#/contacts/'+esc(v)+'">'+esc(nameOf('contacts',v))+'</a>';
  var s = fmtVal(t,k,v,rec);
  if(/^https?:\/\//.test(s)) return '<a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a>';
  return esc(s);
}
async function sha256(str){
  if(window.crypto && crypto.subtle){ var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); }
  // 비보안 컨텍스트 폴백(file://) — 간단 해시
  var h=0; for(var i=0;i<str.length;i++){ h=((h<<5)-h+str.charCodeAt(i))|0; } return 'x'+(h>>>0).toString(16);
}
function csvEscape(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function parseCSV(text){ // RFC4180 간이 파서
  var rows=[],row=[],cur='',q=false; text = text.replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){ var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return c!==''; }); });
}

function debounce(fn,ms){ var h; return function(){ var a=arguments,c=this; clearTimeout(h); h=setTimeout(function(){ fn.apply(c,a); },ms); }; }

var LS_KEY='mobon_crm_';
function scriptUrl(){ return localStorage.getItem(LS_KEY+'script_url') || SCRIPT_URL; }
async function api(cmd, params){
  params = params||{};
  if(DEMO) return demoApi(cmd, params);
  var url = scriptUrl(); if(!url) throw new Error('SCRIPT_URL이 설정되지 않았습니다');
  var q = Object.assign({cmd:cmd, token:TOKEN||''}, params);
  var qs = Object.keys(q).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(q[k]==null?'':q[k]); }).join('&');
  var j, lastErr;
  for(var attempt=0; attempt<3; attempt++){
    try{ var res = qs.length>6000 ? await fetch(url, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:qs, redirect:'follow'}) : await fetch(url+'?'+qs, {method:'GET', redirect:'follow'}); var txt = await res.text(); j = JSON.parse(txt); lastErr=null; break; }
    catch(e){ lastErr=e; console.warn('api retry', cmd, attempt, e.message); await new Promise(function(r){ setTimeout(r, 700*(attempt+1)); }); }
  }
  if(lastErr) throw new Error('서버 응답 오류 (네트워크/일시 오류): '+lastErr.message);
  if(!j.ok){ if(j.error==='AUTH'){ logout(); throw new Error('로그인이 만료되었습니다'); } throw new Error(j.error||'오류'); }
  return j;
}
async function apiUpsert(table, obj){
  var r = await api('upsert',{table:table,data:JSON.stringify(obj)});
  var row = r.row; var arr = DB[table] = DB[table]||[]; var i = arr.findIndex(function(x){ return x.id===row.id; });
  if(i>=0) arr[i]=row; else arr.push(row); rebuildIndex(); saveCache(); return row;
}
async function apiBatch(table, rows){
  var out=[]; for(var i=0;i<rows.length;i+=40){ var r = await api('batch',{table:table,rows:JSON.stringify(rows.slice(i,i+40))}); out = out.concat(r.rows||[]); }
  var arr = DB[table] = DB[table]||[]; out.forEach(function(row){ var i = arr.findIndex(function(x){ return x.id===row.id; }); if(i>=0) arr[i]=row; else arr.push(row); }); rebuildIndex(); saveCache(); return out;
}
async function apiDelete(table, id){ await api('delete',{table:table,id:id}); DB[table] = (DB[table]||[]).filter(function(x){ return x.id!==id; }); rebuildIndex(); saveCache(); }

function expandCompact(c){ var db={}; Object.keys(c).forEach(function(t){ var h=c[t].h; db[t]=c[t].r.map(function(row){ var o={}; for(var i=0;i<h.length;i++) o[h[i]]=row[i]; return o; }); }); return db; }
/* ─── 로컬 캐시(IndexedDB) + 증분 동기화 ─── */
var CACHE_TS='';
function idb(){ return new Promise(function(res,rej){ try{ var q=indexedDB.open('mobon_crm',1); q.onupgradeneeded=function(){ q.result.createObjectStore('kv'); }; q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); }; }catch(e){ rej(e); } }); }
async function cacheGet(k){ try{ var d=await idb(); return await new Promise(function(res){ var t=d.transaction('kv').objectStore('kv').get(k); t.onsuccess=function(){ res(t.result); }; t.onerror=function(){ res(null); }; }); }catch(e){ return null; } }
async function cacheSet(k,v){ try{ var d=await idb(); await new Promise(function(res){ var t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
var _saveT; function saveCache(){ if(DEMO) return; clearTimeout(_saveT); _saveT=setTimeout(function(){ cacheSet('db_'+(ME&&ME.username),{ts:CACHE_TS,db:DB}); },800); }
function applyChanges(r){ var c=r.compact||{}; var n=0; Object.keys(c).forEach(function(t){ var h=c[t].h; var arr=DB[t]=DB[t]||[]; var idx={}; arr.forEach(function(x,i){ idx[x.id]=i; }); c[t].r.forEach(function(row){ var o={}; for(var i=0;i<h.length;i++) o[h[i]]=row[i]; if(idx[o.id]!=null) arr[idx[o.id]]=o; else { idx[o.id]=arr.length; arr.push(o); } n++; }); });
  (r.deletions||[]).forEach(function(d){ var t=d[0], id=d[1]; if(DB[t]){ var before=DB[t].length; DB[t]=DB[t].filter(function(x){ return x.id!==id; }); if(DB[t].length!==before) n++; } }); rebuildIndex(); CACHE_TS=r.ts||CACHE_TS; return n; }
async function syncChanges(silent){ if(DEMO||!CACHE_TS) return 0; try{ var r=await api('changes',{since:CACHE_TS}); var n=applyChanges(r); saveCache(); if(n&&!silent) toast('변경 '+n+'건 반영'); return n; }catch(e){ console.warn('sync',e); if(/AUTH/.test(e.message)){ toast('로그인이 만료되었습니다',true); logout(); } return 0; } }

/* ═══════════════════════════ 필드 접근·필터 엔진 (목록·보고서 공용) ═══════════════════════════ */
function resolveKey(table, key){ // 'account.company' → {table:'accounts', k:'company', join:...}
  var i = key.indexOf('.'); if(i<0) return {table:table, k:key};
  var alias = key.slice(0,i), j = (JOINS[table]||{})[alias]; if(!j) return {table:table,k:key};
  return {table:j.table, k:key.slice(i+1), join:j};
}
function primaryContactId(oppId){ var l=(DB.opp_contacts||[]).filter(function(x){ return x.opp_id===oppId; }); var p=l.filter(function(x){ return isTrue(x.is_primary); })[0]||l[0]; return p?p.contact_id:''; }
function getVal(table, rec, key){
  if(key==='primary_contact'&&table==='opportunities') return primaryContactId(rec.id);
  var r = resolveKey(table, key);
  if(!r.join) return rec[key];
  var j = r.join; if(j.when){ for(var c in j.when) if(rec[c]!==j.when[c]) return ''; }
  var parent = get(j.table, rec[j.via]); return parent? parent[r.k] : '';
}
function keyLabel(table, key){ var r = resolveKey(table,key); var l = fieldDef(r.table, r.k).label; return r.join? r.join.label+' › '+l : l; }
function keyDef(table, key){ var r = resolveKey(table,key); return fieldDef(r.table,r.k); }
function fmtKey(table, rec, key){ if(key==='primary_contact') return nameOf('contacts',getVal(table,rec,key)); var r=resolveKey(table,key); if(!r.join) return fmtVal(table,key,rec[key],rec); var j=r.join; var p=get(j.table,rec[j.via]); return p? fmtVal(j.table,r.k,p[r.k],p):''; }
function linkKey(table, rec, key){ if(key==='primary_contact'){ var cid=getVal(table,rec,key); return cid&&get('contacts',cid)?'<a href="#/contacts/'+esc(cid)+'">'+esc(nameOf('contacts',cid))+'</a>':''; } var r=resolveKey(table,key); if(!r.join) return linkVal(table,key,rec[key],rec); var j=r.join; if(j.when){ for(var c in j.when) if(rec[c]!==j.when[c]) return ''; } var p=get(j.table,rec[j.via]); if(!p) return ''; if(r.k===(SCHEMA[j.table]||{}).nameField) return '<a href="#/'+j.table+'/'+esc(p.id)+'">'+esc(p[r.k])+'</a>'; return linkVal(j.table,r.k,p[r.k],p); }
function reportFields(table){ // 보고서/목록에서 고를 수 있는 키 목록
  var out = allFields(table).map(function(f){ return {key:f.k,label:f.label,type:f.type}; });
  Object.keys(JOINS[table]||{}).forEach(function(alias){ var j=JOINS[table][alias]; allFields(j.table).forEach(function(f){ if(f.type==='textarea') return; out.push({key:alias+'.'+f.k,label:j.label+' › '+f.label,type:f.type}); }); });
  return out;
}
var OPS = { text:[['contains','포함'],['eq','같음'],['ne','같지 않음'],['empty','비어 있음'],['notempty','비어 있지 않음']],
  select:[['in','다음 중 하나'],['nin','다음 제외'],['empty','비어 있음'],['notempty','비어 있지 않음']],
  number:[['eq','='],['gt','>'],['gte','≥'],['lt','<'],['lte','≤'],['between','범위'],['empty','비어 있음']],
  date:[['rel','상대 기간'],['gte','이후(포함)'],['lte','이전(포함)'],['between','범위'],['eq','같음'],['empty','비어 있음'],['notempty','비어 있지 않음']],
  check:[['true','체크됨'],['false','체크 안 됨']] };
var REL = [['today','오늘'],['yesterday','어제'],['this_week','이번 주'],['last_week','지난 주'],['this_month','이번 달'],['last_month','지난 달'],['next_month','다음 달'],['this_quarter','이번 분기'],['this_year','올해'],['last_year','작년'],['last_7','최근 7일'],['last_30','최근 30일'],['last_90','최근 90일'],['next_30','향후 30일']];
function opGroup(def){ var t=def.type; if(t==='select'||t==='lookup'||t==='user'||t==='stage') return 'select'; if(t==='number'||t==='currency'||t==='percent') return 'number'; if(t==='date'||t==='datetime') return 'date'; if(t==='check') return 'check'; return 'text'; }
function relRange(code){
  var d=new Date(), y=d.getFullYear(), m=d.getMonth(), day=d.getDate(), dow=(d.getDay()+6)%7; // 월요일 시작
  function iso(x){ return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate()); }
  function D(yy,mm,dd){ return new Date(yy,mm,dd); }
  switch(code){
    case 'today': return [iso(d),iso(d)]; case 'yesterday': var y1=D(y,m,day-1); return [iso(y1),iso(y1)];
    case 'this_week': return [iso(D(y,m,day-dow)),iso(D(y,m,day-dow+6))]; case 'last_week': return [iso(D(y,m,day-dow-7)),iso(D(y,m,day-dow-1))];
    case 'this_month': return [iso(D(y,m,1)),iso(D(y,m+1,0))]; case 'last_month': return [iso(D(y,m-1,1)),iso(D(y,m,0))]; case 'next_month': return [iso(D(y,m+1,1)),iso(D(y,m+2,0))];
    case 'this_quarter': var q=Math.floor(m/3)*3; return [iso(D(y,q,1)),iso(D(y,q+3,0))];
    case 'this_year': return [y+'-01-01',y+'-12-31']; case 'last_year': return [(y-1)+'-01-01',(y-1)+'-12-31'];
    case 'last_7': return [iso(D(y,m,day-6)),iso(d)]; case 'last_30': return [iso(D(y,m,day-29)),iso(d)]; case 'last_90': return [iso(D(y,m,day-89)),iso(d)];
    case 'next_30': return [iso(d),iso(D(y,m,day+30))];
  } return ['',''];
}
function matchFilter(table, rec, f){
  var def = keyDef(table,f.field), g = opGroup(def), v = getVal(table,rec,f.field); if(v==null) v='';
  var sv = String(v), op=f.op, val=f.value;
  if(op==='empty') return sv===''; if(op==='notempty') return sv!=='';
  if(g==='check'){ return op==='true'? isTrue(v) : !isTrue(v); }
  if(g==='select'){ var arr = Array.isArray(val)?val:String(val||'').split('|').filter(Boolean); var hit=arr.indexOf(sv)>=0||(sv===''&&arr.indexOf('(없음)')>=0); if(op==='in') return hit; if(op==='nin') return !hit; return true; }
  if(g==='number'){ var n=num(v), a=num(Array.isArray(val)?val[0]:val), b=num(Array.isArray(val)?val[1]:val); if(sv==='') return false; switch(op){ case 'eq':return n===a; case 'gt':return n>a; case 'gte':return n>=a; case 'lt':return n<a; case 'lte':return n<=a; case 'between':return n>=a&&n<=b; } return true; }
  if(g==='date'){ var dv=sv.slice(0,10); if(op==='rel'){ var rr=relRange(val); return dv!==''&&dv>=rr[0]&&dv<=rr[1]; } var a2=Array.isArray(val)?val[0]:val, b2=Array.isArray(val)?val[1]:val; if(dv==='') return false; switch(op){ case 'eq':return dv===a2; case 'gte':return dv>=a2; case 'lte':return dv<=a2; case 'between':return dv>=a2&&dv<=b2; } return true; }
  var l=sv.toLowerCase(), q=String(val||'').toLowerCase(); if(op==='contains') return l.indexOf(q)>=0; if(op==='eq') return l===q; if(op==='ne') return l!==q; return true;
}
function applyFilters(table, rows, filters){ if(!filters||!filters.length) return rows; return rows.filter(function(r){ return filters.every(function(f){ return matchFilter(table,r,f); }); }); }
function filterText(table, f){ var def=keyDef(table,f.field), g=opGroup(def), opl=(OPS[g]||OPS.text).filter(function(o){ return o[0]===f.op; })[0]; var v=f.value;
  if(f.op==='rel') v=(REL.filter(function(r){ return r[0]===v; })[0]||[])[1]||v; else if(Array.isArray(v)) v=v.join(' ~ '); else if(g==='select') v=String(v||'').split('|').map(function(x){ return def.type==='lookup'?nameOf(def.table,x): def.type==='user'?userName(x):x; }).join(', ');
  return keyLabel(table,f.field)+' '+(opl?opl[1]:f.op)+(v!==undefined&&v!==''&&f.op!=='empty'&&f.op!=='notempty'&&g!=='check'?' '+v:''); }
function sortRows(table, rows, key, dir){ if(!key) return rows; var def=keyDef(table,key), numeric=['number','currency','percent'].indexOf(def.type)>=0; var m=dir==='desc'?-1:1;
  return rows.slice().sort(function(a,b){ var x=getVal(table,a,key), y=getVal(table,b,key); if(def.type==='lookup'){ x=nameOf(def.table,x); y=nameOf(def.table,y); } if(numeric){ return (num(x)-num(y))*m; } x=String(x==null?'':x); y=String(y==null?'':y); if(x===y) return 0; if(x==='') return 1; if(y==='') return -1; return x.localeCompare(y,'ko')*m; }); }

/* ─── 필터 편집 UI (목록·보고서 공용) ─── */
function filterEditorHtml(table, f, idx){
  var fields = reportFields(table); var def = f.field? keyDef(table,f.field):{type:'text'}; var g = opGroup(def);
  var h = '<div class="inline" data-fi="'+idx+'" style="flex-wrap:wrap;margin-bottom:6px">';
  h += '<select class="fe-field" style="width:200px">'+fields.map(function(x){ return '<option value="'+esc(x.key)+'"'+(x.key===f.field?' selected':'')+'>'+esc(x.label)+'</option>'; }).join('')+'</select>';
  h += '<select class="fe-op" style="width:130px">'+(OPS[g]||OPS.text).map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===f.op?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>';
  h += '<span class="fe-val">'+filterValueHtml(table,f)+'</span><button class="small fe-del">✕</button></div>'; return h;
}
function filterValueHtml(table, f){
  var def=keyDef(table,f.field), g=opGroup(def); var v=f.value;
  if(f.op==='empty'||f.op==='notempty'||g==='check') return '';
  if(g==='select'){ var opts = selectOptions(def, table); var sel = Array.isArray(v)?v:String(v||'').split('|');
    return '<select multiple class="fe-v" style="width:220px;height:90px">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(sel.indexOf(o[0])>=0?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select>'; }
  if(g==='date'){ if(f.op==='rel') return '<select class="fe-v" style="width:140px">'+REL.map(function(r){ return '<option value="'+r[0]+'"'+(r[0]===v?' selected':'')+'>'+r[1]+'</option>'; }).join('')+'</select>';
    if(f.op==='between') return '<input type="date" class="fe-v" style="width:140px" value="'+esc(Array.isArray(v)?v[0]:'')+'"> ~ <input type="date" class="fe-v2" style="width:140px" value="'+esc(Array.isArray(v)?v[1]:'')+'">';
    return '<input type="date" class="fe-v" style="width:140px" value="'+esc(Array.isArray(v)?v[0]:(v||''))+'">'; }
  if(g==='number'){ if(f.op==='between') return '<input type="number" class="fe-v" style="width:110px" value="'+esc(Array.isArray(v)?v[0]:'')+'"> ~ <input type="number" class="fe-v2" style="width:110px" value="'+esc(Array.isArray(v)?v[1]:'')+'">'; return '<input type="number" class="fe-v" style="width:140px" value="'+esc(Array.isArray(v)?v[0]:(v||''))+'">'; }
  return '<input type="text" class="fe-v" style="width:180px" value="'+esc(Array.isArray(v)?v[0]:(v||''))+'">';
}
function selectOptions(def, table){ // [[value,label]]
  if(def.type==='stage') return STAGES.map(function(s){ return [s.name,s.name+(s.active==='FALSE'?' (비활성)':'')]; });
  if(def.type==='user') return users().map(function(u){ return [u.username,u.name]; });
  if(def.type==='lookup'){ var tb=def.table||'accounts'; return (DB[tb]||[]).slice().sort(function(a,b){ return String(a[SCHEMA[tb].nameField]).localeCompare(String(b[SCHEMA[tb].nameField]),'ko'); }).map(function(r){ return [r.id, r[SCHEMA[tb].nameField]]; }); }
  if(def.options) return def.options.map(function(o){ return [o,(def.labels||{})[o]||o]; });
  if(def.list) return listValues(def.list).map(function(v){ return [v,v]; });
  return [];
}
function bindFilterEditor(container, table, filters, onChange){
  function redraw(){ container.innerHTML = filters.map(function(f,i){ return filterEditorHtml(table,f,i); }).join('')+'<button class="small" id="feAdd">+ 필터 추가</button>'; wire(); }
  function readAll(){ $$('[data-fi]',container).forEach(function(el){ var i=+el.dataset.fi, f=filters[i]; f.field=$('.fe-field',el).value; f.op=$('.fe-op',el).value; var v=$('.fe-v',el), v2=$('.fe-v2',el); if(!v){ f.value=''; } else if(v.multiple){ f.value=Array.from(v.selectedOptions).map(function(o){ return o.value; }).join('|'); } else if(v2){ f.value=[v.value,v2.value]; } else f.value=v.value; }); }
  function wire(){ $$('[data-fi]',container).forEach(function(el){ var i=+el.dataset.fi;
      $('.fe-field',el).onchange=function(){ readAll(); var def=keyDef(table,filters[i].field); filters[i].op=(OPS[opGroup(def)]||OPS.text)[0][0]; filters[i].value=''; redraw(); onChange&&onChange(); };
      $('.fe-op',el).onchange=function(){ readAll(); filters[i].value=''; redraw(); onChange&&onChange(); };
      $$('.fe-v,.fe-v2',el).forEach(function(x){ x.onchange=function(){ readAll(); onChange&&onChange(); }; });
      $('.fe-del',el).onclick=function(){ readAll(); filters.splice(i,1); redraw(); onChange&&onChange(); }; });
    $('#feAdd',container).onclick=function(){ readAll(); var f0=reportFields(table)[0]; filters.push({field:f0.key,op:(OPS[opGroup(keyDef(table,f0.key))]||OPS.text)[0][0],value:''}); redraw(); }; }
  redraw(); return {read:readAll};
}

/* ═══════════════════════════ 목록 보기 ═══════════════════════════ */
var LIST_STATE = {};
function viewsFor(table){ return (DB.views||[]).filter(function(v){ return v.object===table && (isTrue(v.is_public)||v.owner===ME.username); }); }
function renderList(main, table){
  var s = SCHEMA[table]; var st = LIST_STATE[table] = LIST_STATE[table] || {q:'', filters:[], cols:s.listCols.slice(), sort:'updated_at', dir:'desc', viewId:localStorage.getItem(LS_KEY+'view_'+table)||''};
  if(st.viewId && !st._loaded){ var v=get('views',st.viewId); if(v) applyView(st,v); st._loaded=true; }
  main.innerHTML = '<div class="page-head"><h1>'+esc(s.label)+'</h1><span class="sub" id="lsCount"></span><div class="actions">'+
    '<select id="lsView" style="width:200px"><option value="">— 저장된 목록 —</option>'+viewsFor(table).map(function(v){ return '<option value="'+v.id+'"'+(v.id===st.viewId?' selected':'')+'>'+esc(v.name)+(isTrue(v.is_public)?'':' (내 목록)')+'</option>'; }).join('')+'</select>'+
    '<button onclick="saveViewDlg(\''+table+'\')">목록 저장</button><button onclick="columnsDlg(\''+table+'\')">열 선택</button><button onclick="exportList(\''+table+'\')">CSV</button>'+
    (table==='activities'?'<button class="primary" onclick="quickLog()">활동 기록</button>':'<button class="primary" onclick="openForm(\''+table+'\')">새로 만들기</button>')+'</div></div>'+
    '<div class="bar"><input type="search" id="lsQ" placeholder="이 목록 검색…" value="'+esc(st.q)+'"><button class="small" onclick="filterDlg(\''+table+'\')">필터</button><span id="lsChips"></span></div>'+
    '<div class="tblwrap" id="lsTbl"></div>';
  $('#lsQ').addEventListener('input', debounce(function(){ st.q=this.value; drawList(table); },150));
  $('#lsView').onchange=function(){ st.viewId=this.value; localStorage.setItem(LS_KEY+'view_'+table,st.viewId); var v=get('views',st.viewId); if(v) applyView(st,v); else { st.filters=[]; st.cols=s.listCols.slice(); } renderList(main,table); };
  drawList(table);
}
function applyView(st,v){ try{ st.cols=JSON.parse(v.columns||'[]'); st.filters=JSON.parse(v.filters||'[]'); }catch(e){} st.sort=v.sort_field||st.sort; st.dir=v.sort_dir||st.dir; }
function listRows(table){ var st=LIST_STATE[table]; var rows=applyFilters(table, DB[table]||[], st.filters);
  if(st.q){ var q=st.q.toLowerCase(); rows=rows.filter(function(r){ return st.cols.some(function(k){ return String(fmtKey(table,r,k)).toLowerCase().indexOf(q)>=0; }); }); }
  return sortRows(table, rows, st.sort, st.dir); }
function drawList(table){

  show.forEach(function(r,i){ h+='<tr>'+'<td class="muted">'+(i+1)+'</td>'+st.cols.map(function(k,ci){ var d=keyDef(table,k); var numc=['number','currency','percent'].indexOf(d.type)>=0; var cell = ci===0? '<a href="#/'+table+'/'+r.id+'">'+esc(fmtKey(table,r,k)||'(제목 없음)')+'</a>' : linkKey(table,r,k); return '<td class="'+(numc?'num':'')+(d.type==='textarea'?' wrap':'')+'">'+cell+'</td>'; }).join('')+
    '<td>'+(canEdit(r)?'<button class="small" onclick="openForm(\''+table+'\',\''+r.id+'\')">편집</button>':'')+'</td></tr>'; });
  h+='</tbody></table>'+(rows.length>500?'<div class="help">상위 500건만 표시. 필터로 좁히거나 CSV로 내보내세요.</div>':'');
  $('#lsTbl').innerHTML=h;

function sortList(table,k){ var st=LIST_STATE[table]; if(st.sort===k) st.dir=st.dir==='asc'?'desc':'asc'; else { st.sort=k; st.dir='asc'; } drawList(table); }
function filterDlg(table){ var st=LIST_STATE[table]; var fs = JSON.parse(JSON.stringify(st.filters));
  openModal('<h2>필터</h2><div id="feBox"></div><div class="foot"><button onclick="closeModal()">취소</button><button class="primary" id="feOk">적용</button></div>');

function saveViewDlg(table){ var st=LIST_STATE[table]; var cur=get('views',st.viewId);

  async function save(id){ var name=$('#svName').value.trim(); if(!name){ toast('이름 입력',true); return; } var v=await apiUpsert('views',{id:id||'',object:table,name:name,columns:JSON.stringify(st.cols),filters:JSON.stringify(st.filters),sort_field:st.sort,sort_dir:st.dir,owner:ME.username,is_public:$('#svPub').checked?'TRUE':'FALSE'}); st.viewId=v.id; localStorage.setItem(LS_KEY+'view_'+table,v.id); closeModal(); toast('저장됨'); renderList($('#main'),table); }

/* ═══════════════════════════ 공통 폼 (등록/수정) ═══════════════════════════ */
function inputHtml(table, f, val, rec){
  var id='ff_'+f.k, v = val==null?'':val;
  if(f.ro) return '<input type="text" id="'+id+'" value="'+esc(fmtVal(table,f.k,v,rec))+'" disabled>';
  switch(f.type){

function closeOppDlg(oppId){ var rec=get('opportunities',oppId); if(!canEdit(rec)){ toast('수정 권한이 없습니다',true); return; }

async function changeStage(oppId, stageName){
  var rec=get('opportunities',oppId); if(!canEdit(rec)){ toast('수정 권한이 없습니다',true); return; } if(rec.stage===stageName) return;
  var st=stageByName(stageName); var upd=Object.assign({},rec,{stage:stageName,probability:st.probability,forecast:st.forecast});
  if(st.forecast==='Omitted'){ // 실주 사유 입력
    openModal('<h2>실주 처리 — '+esc(stageName)+'</h2><div class="f"><label class="req">실주사유</label><select id="lrSel"><option value="">—</option>'+listValues('loss_reason').map(function(v){ return '<option'+(rec.loss_reason===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+'</select></div><div class="f mt"><label class="req">실주 사유 상세</label><textarea id="lrTxt">'+esc(rec.loss_detail||'')+'</textarea></div><div class="foot"><button onclick="closeModal()">취소</button><button class="danger" id="lrOk">실주 확정</button></div>','narrow');
    $('#lrOk').onclick=async function(){ var r=$('#lrSel').value, d=$('#lrTxt').value.trim(); if(!r||!d){ toast('실주사유와 상세를 입력하세요',true); return; } upd.loss_reason=r; upd.loss_detail=d; closeModal(); await commitStage(upd); }; return; }
  if(!await confirmDlg('단계를 "'+stageName+'"(으)로 변경할까요?')) return; await commitStage(upd);
}
async function commitStage(upd){ var saved; try{ saved=await apiUpsert('opportunities',upd); }catch(e){ toast('단계 변경 실패: '+e.message,true); return; }
  toast('단계 변경: '+saved.stage); route();
  logStageHistory(saved); }
async function logStageHistory(saved){ var row={opp_id:saved.id,stage:saved.stage,amount:saved.amount,probability:saved.probability,close_date:saved.close_date,changed_by:ME.username,changed_at:nowLocal()}; for(var i=0;i<3;i++){ try{ await apiUpsert('stage_history',row); if(location.hash.indexOf(saved.id)>=0) route(); return; }catch(e){ console.warn('stage_history retry',i,e.message); await new Promise(function(r){ setTimeout(r,800*(i+1)); }); } } toast('단계 내역 기록에 실패했습니다(단계 자체는 저장됨)',true); }

function runCfg(rep, st){ return Object.assign({},rep,{filters:JSON.stringify(st.filters),group1:st.group1,grain1:st.grain1,group2:st.group2,grain2:st.grain2,sort_field:st.sort_field,sort_dir:st.sort_dir,sort_g1:st.sort_g1,dir_g1:st.dir_g1,sort_g2:st.sort_g2,dir_g2:st.dir_g2}); }
function renderReportRun(main, id){

  main.innerHTML='<div class="page-head rrh"><div><div class="muted" style="font-size:12px">보고서: '+esc(REPORT_OBJECTS[rep.object]||rep.object)+'</div><h1>'+esc(rep.name)+'</h1>'+(rep.description?'<div class="sub">'+esc(rep.description)+'</div>':'')+'</div><div class="actions"><span id="rrDirty" class="hidden"><span class="tag y">임시 변경</span> '+(canEdit(rep)?'<button class="small" id="rrSaveChg">보고서에 저장</button> ':'')+'<button class="small" id="rrReset">되돌리기</button></span><button onclick="runFilterDlg(\''+id+'\')">필터</button><button onclick="exportReport(\''+id+'\')">CSV</button>'+(canEdit(rep)?'<button onclick="go(\'#/reports/'+id+'/edit\')">편집</button>':'')+'<button onclick="copyReport(\''+id+'\')">복사</button></div></div>'+
    '<div class="bar" id="rrChips"></div><div id="rrChart" class="panel hidden"><div class="chart-box"><canvas id="rrCanvas"></canvas></div></div><div class="rrsum" id="rrSummary"></div><div class="tblwrap rr" id="rrTbl"></div>'+
    '<div class="rrfoot">'+[['counts','행 수'],['detail','세부 사항 행'],['subtotal','소계'],['total','총합']].map(function(t){ return '<label class="sw"><input type="checkbox" data-t="'+t[0]+'"'+(st[t[0]]?' checked':'')+'><span class="track"></span>'+t[1]+'</label>'; }).join('')+'</div>';
  $$('.rrfoot input').forEach(function(c){ c.onchange=function(){ st[c.dataset.t]=c.checked; drawRun(id); }; });
  $('#rrReset').onclick=function(){ delete RUN_STATE[id]; renderReportRun(main,id); };
  if($('#rrSaveChg')) $('#rrSaveChg').onclick=async function(){ try{ var r=runCfg(rep,st); await apiUpsert('reports',r); toast('보고서에 저장됨'); delete RUN_STATE[id]; route(); }catch(e){ toast(e.message,true); } };
  drawRun(id);
}
function drawRun(id){ var rep=get('reports',id), st=RUN_STATE[id]; var r2=runCfg(rep,st); var res=runReport(r2);
  $('#rrChips').innerHTML=st.filters.map(function(f,i){ return '<span class="chip" title="클릭하여 편집" onclick="runFilterDlg(\''+id+'\')"><b>'+esc(filterText(rep.object,f))+'</b><span class="x" onclick="event.stopPropagation();RUN_STATE[\''+id+'\'].filters.splice('+i+',1);RUN_STATE[\''+id+'\'].dirty=true;drawRun(\''+id+'\')">✕</span></span>'; }).join(' ')||'<span class="muted">필터 없음</span>';
  $('#rrSummary').innerHTML='<div class="kpi"><div class="k">총 레코드</div><div class="v">'+res.rows.length.toLocaleString()+'</div></div>'+res.aggs.map(function(a){ return '<div class="kpi"><div class="k">'+esc(aggLabel(res.table,a))+'</div><div class="v">'+fmtAgg(res.table,a,res.total[a.fn+':'+a.field])+'</div></div>'; }).join('');
  if(rep.chart_type&&rep.chart_type!=='table'&&rep.chart_type!=='number'&&r2.group1){ $('#rrChart').classList.remove('hidden'); drawChart($('#rrCanvas'),rep.chart_type,reportChartData(r2,res,rep.metric),!!r2.group2); } else $('#rrChart').classList.add('hidden');
  $('#rrTbl').innerHTML=reportTableHtml(r2,res,{detail:st.detail,subtotal:st.subtotal,total:st.total,counts:st.counts,menus:true});
  $('#rrDirty').classList.toggle('hidden',!st.dirty);
  $$('#rrTbl .hm').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); headerMenu(id,b.dataset.k,b.dataset.kind,b); }; });
}
function headerMenu(id, key, kind, anchor){ var rep=get('reports',id), st=RUN_STATE[id], table=rep.object; var def=keyDef(table,key); var isDate=def.type==='date'||def.type==='datetime';
  var items=[];
  function mark(){ st.dirty=true; }
  if(kind==='col'){ items.push({l:'↑ 오름차순 정렬',f:function(){ st.sort_field=key; st.sort_dir='asc'; mark(); }}); items.push({l:'↓ 내림차순 정렬',f:function(){ st.sort_field=key; st.sort_dir='desc'; mark(); }});
    if(def.type!=='textarea'){ items.push({sep:1}); if(!st.group1) items.push({l:'▤ 이 열로 그룹화',f:function(){ st.group1=key; st.grain1=isDate?'month':''; mark(); }}); else if(!st.group2&&st.group1!==key) items.push({l:'▤ 2단 그룹으로 추가',f:function(){ st.group2=key; st.grain2=isDate?'month':''; mark(); }}); } }
  else { var gk=kind==='g1'?'sort_g1':'sort_g2', gd=kind==='g1'?'dir_g1':'dir_g2', grainK=kind==='g1'?'grain1':'grain2';
    items.push({l:'↑ 오름차순 정렬',f:function(){ st[gk]=st[gk]||'label'; st[gd]='asc'; mark(); }}); items.push({l:'↓ 내림차순 정렬',f:function(){ st[gk]=st[gk]||'label'; st[gd]='desc'; mark(); }});
    var aggs=parseJSON(rep.aggregates,[]); var byOpts=[['label','그룹 이름'],['count','레코드 개수']].concat(aggs.map(function(a){ return [a.fn+':'+a.field,aggLabel(table,a)]; }));
    items.push({sub:'정렬 기준',opts:byOpts.map(function(o){ return {l:o[1],on:(st[gk]||'label')===o[0],f:function(){ st[gk]=o[0]; mark(); }}; })});
    if(isDate) items.push({sub:'그룹화 날짜 기준',opts:[['day','일'],['week','주'],['month','달력 달'],['quarter','달력 분기'],['year','달력 연도']].map(function(o){ return {l:o[1],on:(st[grainK]||'')===o[0],f:function(){ st[grainK]=o[0]; mark(); }}; })});
    items.push({sep:1}); items.push({l:'✕ 그룹 제거',f:function(){ if(kind==='g1'){ st.group1=st.group2; st.grain1=st.grain2; st.sort_g1=st.sort_g2; st.dir_g1=st.dir_g2; } st.group2=''; st.grain2=''; st.sort_g2=''; mark(); }}); }
  items.push({sep:1}); items.push({l:'▽ 이 필드로 필터',f:function(){ var f0={field:key,op:(OPS[opGroup(def)]||OPS.text)[0][0],value:''}; st.filters.push(f0); mark(); runFilterDlg(id); return 'nodraw'; }});
  showMenu(anchor, items, function(){ drawRun(id); });
}
function showMenu(anchor, items, after){ var old=$('#ctxmenu'); if(old) old.remove(); var m=document.createElement('div'); m.id='ctxmenu'; m.className='ctxmenu';
  m.innerHTML=items.map(function(it,i){ if(it.sep) return '<div class="sep"></div>'; if(it.sub) return '<div class="subh">'+esc(it.sub)+'</div>'+it.opts.map(function(o,j){ return '<div class="it sub'+(o.on?' on':'')+'" data-i="'+i+'" data-j="'+j+'">'+(o.on?'✓ ':'')+esc(o.l)+'</div>'; }).join(''); return '<div class="it" data-i="'+i+'">'+esc(it.l)+'</div>'; }).join('');
  document.body.appendChild(m); var r=anchor.getBoundingClientRect(); m.style.left=Math.min(r.left,window.innerWidth-240)+'px'; m.style.top=(r.bottom+4)+'px';
  $$('.it',m).forEach(function(el){ el.onclick=function(){ var it=items[+el.dataset.i]; var f=el.dataset.j!=null?it.opts[+el.dataset.j].f:it.f; m.remove(); var res=f&&f(); if(res!=='nodraw'&&after) after(); }; });
  setTimeout(function(){ document.addEventListener('click',function h(){ m.remove(); document.removeEventListener('click',h); }); },0); }
function runFilterDlg(id){ var st=RUN_STATE[id], rep=get('reports',id); var fs=JSON.parse(JSON.stringify(st.filters)); openModal('<h2>필터 (실행 중 임시 변경)</h2><div id="feBox"></div><div class="foot"><button onclick="closeModal()">취소</button><button class="primary" id="feOk">적용</button></div>'); var ed=bindFilterEditor($('#feBox'),rep.object,fs); $('#feOk').onclick=function(){ ed.read(); st.filters=fs.filter(function(f){ return f.field; }); st.dirty=true; closeModal(); drawRun(id); }; }
function exportReport(id){ var rep=get('reports',id), st=RUN_STATE[id]||{filters:parseJSON(rep.filters,[])}; var r2=Object.assign({},rep,{filters:JSON.stringify(st.filters)}); var res=runReport(r2); var cols=res.cols.length?res.cols:['id']; var lines=[]; var head=[]; if(rep.group1) head.push(keyLabel(res.table,rep.group1)); if(rep.group2) head.push(keyLabel(res.table,rep.group2)); lines.push(head.concat(cols.map(function(k){ return keyLabel(res.table,k); })).map(csvEscape).join(','));
  function push(r,g1,g2){ var a=[]; if(rep.group1) a.push(g1||''); if(rep.group2) a.push(g2||''); lines.push(a.concat(cols.map(function(k){ return fmtKey(res.table,r,k); })).map(csvEscape).join(',')); }
  if(!res.groups) res.rows.forEach(function(r){ push(r); }); else res.groups.forEach(function(g){ if(g.sub) g.sub.forEach(function(s){ s.rows.forEach(function(r){ push(r,g.label,s.label); }); }); else g.rows.forEach(function(r){ push(r,g.label); }); });
  downloadText(rep.name+'_'+today()+'.csv',lines.join('\n')); }

  openModal('<h2>보고서 만들기</h2><div class="rtp"><div class="cats"><div class="ch">범주</div>'+RT_CATS.map(function(c){ return '<a data-c="'+esc(c)+'">'+esc(c)+'</a>'; }).join('')+'</div>'+

function fieldPicker(input, getFields, onPick){ // 검색형 필드 드롭다운 (그룹/열/필터 추가)
  var wrap=input.parentNode, dd=document.createElement('div'); dd.className='lkdd hidden'; wrap.appendChild(dd); var act=-1;
  function draw(){ var q=(input.value||'').toLowerCase(); var list=getFields().filter(function(f){ return !q||f.label.toLowerCase().indexOf(q)>=0; }).slice(0,60); act=-1;
    if(!list.length){ dd.innerHTML='<div class="none">일치하는 필드 없음</div>'; return; }
    var h='', lastG=null; list.forEach(function(f,i){ var g=f.key.indexOf('.')>=0?f.label.split(' › ')[0]:'기본 정보'; if(g!==lastG){ h+='<div class="gh">'+esc(g)+'</div>'; lastG=g; } h+='<div class="o" data-i="'+i+'"><b>'+esc(f.key.indexOf('.')>=0?f.label.split(' › ').slice(1).join(' › '):f.label)+'</b></div>'; }); dd.innerHTML=h;
    $$('.o',dd).forEach(function(o){ o.onmousedown=function(e){ e.preventDefault(); pick(list[+o.dataset.i]); }; }); dd._list=list; }
  function pick(f){ input.value=''; dd.classList.add('hidden'); onPick(f); }
  function open(){ draw(); dd.classList.remove('hidden'); }
  input.onfocus=open; input.oninput=open; input.onblur=function(){ setTimeout(function(){ dd.classList.add('hidden'); },150); };
  input.onkeydown=function(e){ var os=$$('.o',dd); if(e.key==='ArrowDown'){ act=Math.min(act+1,os.length-1); } else if(e.key==='ArrowUp'){ act=Math.max(act-1,0); } else if(e.key==='Enter'){ e.preventDefault(); if(os.length) pick(dd._list[act<0?0:act]); return; } else if(e.key==='Escape'){ dd.classList.add('hidden'); return; } else return; e.preventDefault(); os.forEach(function(o,i){ o.classList.toggle('act',i===act); }); if(os[act]) os[act].scrollIntoView({block:'nearest'}); };
}
function valueLabel(table, f){ // 필터 카드 요약
  var def=keyDef(table,f.field), g=opGroup(def); var opL=((OPS[g]||OPS.text).filter(function(o){ return o[0]===f.op; })[0]||[])[1]||f.op; var v=f.value;
  if(f.op==='empty'||f.op==='notempty'||g==='check') return opL;
  if(g==='select'){ var opts=selectOptions(def,table), m={}; opts.forEach(function(o){ m[o[0]]=o[1]; }); var vals=(Array.isArray(v)?v:String(v||'').split('|')).filter(Boolean).map(function(x){ return m[x]||x; }); return opL+': '+(vals.length?vals.join(', '):'(선택 안 함)'); }
  if(g==='date'&&f.op==='rel'){ var r=REL.filter(function(x){ return x[0]===v; })[0]; return r?r[1]:'(기간 선택)'; }
  if(f.op==='between') return (Array.isArray(v)?v[0]:'')+' ~ '+(Array.isArray(v)?v[1]:'');
  var s=Array.isArray(v)?v[0]:v; return opL+' '+(s===''||s==null?'(값 입력)':(def.type==='currency'?fmtMoney(s):s));
}

function widgetType(w,rep){ return w.type||rep.chart_type||'table'; }
function widgetChartData(rep,res,w){ var data=reportChartData(rep,res,w.metric||rep.metric||'count');
  if(w.axis==='group2'&&rep.group2&&res.groups){ data={labels:data.datasets.map(function(d){ return d.label; }),datasets:[{label:metricLabel(res.table,w.metric||rep.metric||'count',res.aggs),data:data.datasets.map(function(d){ return d.data.reduce(function(a,b){ return a+(+b||0); },0); }),backgroundColor:PALETTE[0]}]}; }
  var idx=data.labels.map(function(_,i){ return i; }); var tot=function(i){ return data.datasets.reduce(function(s,d){ return s+(+d.data[i]||0); },0); };
  if(w.sort==='value') idx.sort(function(a,b){ return tot(b)-tot(a); }); else if(w.sort==='label') idx.sort(function(a,b){ return String(data.labels[a]).localeCompare(String(data.labels[b]),'ko'); });
  if(w.sort_dir==='desc') idx.reverse();
  var max=+w.max_groups||0; if(max>0&&idx.length>max) idx=idx.slice(0,max);
  return {labels:idx.map(function(i){ return data.labels[i]; }),datasets:data.datasets.map(function(d){ return Object.assign({},d,{data:idx.map(function(i){ return d.data[i]; })}); })}; }
function renderWidgetBody(box, w, rep){ if(!rep){ box.innerHTML='<div class="muted" style="padding:20px">보고서를 찾을 수 없습니다 (삭제되었거나 권한 없음)</div>'; return; }
  var res=runReport(rep); var type=widgetType(w,rep);
  if(type==='number'){ var m=w.metric||rep.metric||'count'; var v=m==='count'?res.total.count:res.total[m]; box.innerHTML='<div class="big">'+(m==='count'?fmtNum(v):fmtAgg(rep.object,{fn:m.split(':')[0],field:m.split(':')[1]},v))+'</div><div class="muted" style="text-align:center">'+esc(metricLabel(rep.object,m,res.aggs))+'</div>'; return; }
  if(type==='table'){ var r2=rep, res2=res; if(w.table_cols&&w.table_cols.length){ r2=Object.assign({},rep,{columns:JSON.stringify(w.table_cols)}); res2=runReport(r2); } box.innerHTML=reportTableHtml(r2,res2,{detail:true,limit:+w.limit||30}); return; }
  if(!res.rows.length){ box.innerHTML='<div class="muted" style="padding:30px 0;text-align:center">차트 데이터가 없습니다.</div>'; return; }
  box.innerHTML='<canvas></canvas>'; var base=type.replace('_s',''); drawChart($('canvas',box),base,widgetChartData(rep,res,w),type.slice(-2)==='_s'); }
function widgetHtml(w,i,d,edit){ var rep=get('reports',w.report_id); var title=w.title||(rep?rep.name:'(보고서 없음)');
  return '<div class="w c'+(w.cols||1)+(w.rows===2?' r2':'')+'" data-wi="'+i+'"'+(edit?' draggable="true"':'')+'><div class="wt"><div class="wtt"><span class="t">'+esc(title)+'</span>'+(w.subtitle?'<span class="st">'+esc(w.subtitle)+'</span>':'')+'</div><span class="sp"></span>'+(edit?'<span class="ic" data-edit="'+i+'" title="위젯 편집">✎</span><span class="ic" data-del="'+i+'" title="위젯 제거">✕</span>':'<span class="ic" data-rf="'+i+'" title="새로 고침">↻</span><span class="ic" data-ex="'+i+'" title="크게 보기">⤢</span>')+'</div><div class="wb" id="wb'+i+'"></div><div class="wf">'+(rep?'<a href="#/reports/'+esc(rep.id)+'">보고서 보기 ('+esc(rep.name)+')</a>':'')+(w.footer?'<span class="ft">'+esc(w.footer)+'</span>':'')+'<span class="ts" id="wts'+i+'"></span></div>'+(edit?'<span class="rz" data-rz="'+i+'" title="드래그하여 크기 조절">◢</span>':'')+'</div>'; }

  var conByName={}; (DB.contacts||[]).forEach(function(c){ conByName[String(c.name).trim()]=c.id; });
  var oppByName={}; (DB.opportunities||[]).forEach(function(o){ oppByName[String(o.name).trim()]=o.id; });
  var userByName={}; users().forEach(function(u){ userByName[u.name]=u.username; userByName[u.username]=u.username; });
  var bySf={}; (DB[t]||[]).forEach(function(r){ if(r.sf_id) bySf[r.sf_id]=r; });
  function accId(name){ if(!name) return ''; var k=String(name).trim().toLowerCase(); if(accByName[k]) return accByName[k]; if(auto){ if(!newAcc[k]) newAcc[k]={id:uid('acc'),name:String(name).trim(),owner:ME.username}; return newAcc[k].id; } warn['계정 못 찾음: '+name]=1; return ''; }
  function conId(name, accid){ if(!name) return ''; var k=String(name).trim(); if(conByName[k]) return conByName[k]; if(auto&&accid){ if(!newCon[k]) newCon[k]={id:uid('con'),name:k,account_id:accid,owner:ME.username}; return newCon[k].id; } warn['연락처 못 찾음: '+name]=1; return ''; }
  IMP.rows.forEach(function(r){ var o={}; IMP.map.forEach(function(k,i){ if(k==='_skip') return; var v=(r[i]||'').trim(); if(v==='') return; var d=fieldDef(t,k);
      if(d.type==='check') v=(/^(true|1|✔|예|y|참|checked)$/i.test(v))?'TRUE':'FALSE';
      else if(d.type==='date'||k==='created_at'){ var m=v.match(/(\d{4})[.\-\/ ]+(\d{1,2})[.\-\/ ]+(\d{1,2})/); if(m) v=m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]); }
      else if(d.type==='currency'||d.type==='number'||d.type==='percent') v=String(num(v));
      else if(d.type==='user') v=userByName[v]||v;
      o[k]=v; });
    if(t==='contacts'){ o.account_id=accId(o.account_id); }
    if(t==='opportunities'){ o.account_id=accId(o.account_id); if(o.agency_account_id) o.agency_account_id=accId(o.agency_account_id); if(o.parent_opp_id) o.parent_opp_id=oppByName[o.parent_opp_id]||''; if(o.stage&&!stageByName(o.stage)) unknownStage[o.stage]=(unknownStage[o.stage]||0)+1; var st=stageByName(o.stage); if(st){ o.probability=st.probability; o.forecast=st.forecast; } }
    if(t==='activities'){ o.what_type='accounts'; o.what_id=accId(o.what_id); o.who_id=conId(o.who_id,o.what_id); o.status=o.status||'Completed'; o.priority=o.priority||'Normal'; if(!o.owner) o.owner=userByName[o.sales_rep]||ME.username; }
    if(!o.owner) o.owner=userByName[o.sales_rep]||ME.username;
    if(o.sf_id&&bySf[o.sf_id]){ if(mode==='skip') return; if(mode==='update') o.id=bySf[o.sf_id].id; }
    var nameF=SCHEMA[t].nameField; if(!o[nameF]){ warn['이름 없는 행 '+(out.length+1)]=1; return; }
    out.push(o); });
  IMP.out=out; IMP.newAcc=Object.keys(newAcc).map(function(k){ return newAcc[k]; }); IMP.newCon=Object.keys(newCon).map(function(k){ return newCon[k]; });
  var w=Object.keys(warn); var us=Object.keys(unknownStage);
  $('#imPrev').innerHTML='<div class="mt"><b>가져올 행 '+out.length+'개</b>'+(IMP.newAcc.length?' · 자동 생성 계정 '+IMP.newAcc.length:'')+(IMP.newCon.length?' · 자동 생성 연락처 '+IMP.newCon.length:'')+'</div>'+(us.length?'<div class="mt"><b>단계 목록에 없는 값</b> (그대로 들어가며, 관리 › 기회 단계에서 일괄 매핑 가능): '+us.map(function(s){ return esc(s)+'('+unknownStage[s]+')'; }).join(', ')+'</div>':'')+(w.length?'<div class="mt err">경고 '+w.length+'건<br>'+w.slice(0,30).map(esc).join('<br>')+(w.length>30?'<br>…':'')+'</div>':'')+'<div class="mt"><button class="primary" onclick="importRun()"'+(out.length?'':' disabled')+'>가져오기 실행</button></div>';
}
async function importRun(){ var btn=event.target; btn.disabled=true; try{ if(IMP.newAcc.length) await apiBatch('accounts',IMP.newAcc); if(IMP.newCon.length) await apiBatch('contacts',IMP.newCon); var res=await apiBatch(IMP.table,IMP.out);
    if(IMP.table==='opportunities'){ var hist=res.filter(function(o){ return !(DB.stage_history||[]).some(function(h){ return h.opp_id===o.id; }); }).map(function(o){ return {opp_id:o.id,stage:o.stage,amount:o.amount,probability:o.probability,close_date:o.close_date,changed_by:o.owner||ME.username,changed_at:(o.updated_at||nowLocal())}; }); if(hist.length) await apiBatch('stage_history',hist); }
    toast(res.length+'건 가져오기 완료'); $('#imPrev').innerHTML='<div class="mt">완료: '+res.length+'건. <a href="#/'+IMP.table+'">목록 보기</a></div>'; }catch(e){ toast(e.message,true); btn.disabled=false; } }

function adminSettings(b){
  b.innerHTML='<div class="panel"><h2>서버 연결</h2><div class="f"><label>Apps Script 웹앱 URL (/exec)</label><input type="text" id="setUrl" value="'+esc(scriptUrl())+'"'+(DEMO?' disabled':'')+'></div><div class="help">index.html을 새 파일로 교체해도 이 값은 브라우저에 저장되어 유지됩니다. 다른 PC에서는 다시 입력해야 하므로 파일 상단 SCRIPT_URL 상수에 넣어두는 것을 권장합니다.</div><div class="mt"><button class="primary" onclick="localStorage.setItem(LS_KEY+\'script_url\',$(\'#setUrl\').value.trim());toast(\'저장됨\')">저장</button> <button onclick="api(\'ping\').then(function(){toast(\'연결 정상\')}).catch(function(e){toast(e.message,true)})">연결 테스트</button></div></div>'+
    '<div class="panel"><h2>로컬 캐시·동기화</h2><div class="help mb">데이터는 이 브라우저에 저장해 두고(IndexedDB) 접속할 때 바뀐 것만 서버에서 받아옵니다. 화면이 이상하면 전체 다시 불러오기를 누르세요.'+(CACHE_TS?' 마지막 동기화: '+esc(fmtDT(CACHE_TS)):'')+'</div><button onclick="refreshData(false)">변경분만 동기화</button> <button class="primary" onclick="refreshData(true)">전체 다시 불러오기</button></div>'+
    '<div class="panel"><h2>내 비밀번호 변경</h2><div class="inline"><input type="password" id="myPw" placeholder="새 비밀번호" style="width:220px"><button onclick="changeMyPw()">변경</button></div></div>'+
    '<div class="panel"><h2>데이터 백업</h2><div class="help mb">모든 데이터는 구글시트에 있으므로 시트 자체가 백업입니다. 아래는 화면 기준 CSV 내려받기입니다.</div>'+Object.keys(SCHEMA).map(function(t){ return '<button class="small" onclick="exportAll(\''+t+'\')">'+SCHEMA[t].label+' 전체 CSV</button> '; }).join('')+'</div>'+
    '<div class="panel"><h2>정보</h2><div class="muted">MOBON CRM v'+APP_VERSION+' · 사용자 '+users().length+'명 · 계정 '+(DB.accounts||[]).length+' · 연락처 '+(DB.contacts||[]).length+' · 기회 '+(DB.opportunities||[]).length+' · 활동 '+(DB.activities||[]).length+(DEMO?' · <b>데모 모드(브라우저 저장)</b>':'')+'</div></div>';
}
async function changeMyPw(){ var p=$('#myPw').value; if(!p){ toast('입력하세요',true); return; } try{ await api('set_password',{hash:await sha256(p)}); toast('변경됨'); $('#myPw').value=''; }catch(e){ toast(e.message,true); } }
function exportAll(t){ var keys=allFields(t).map(function(f){ return f.k; }); var lines=[keys.map(function(k){ return csvEscape(fieldDef(t,k).label); }).join(',')]; (DB[t]||[]).forEach(function(r){ lines.push(keys.map(function(k){ return csvEscape(fmtVal(t,k,r[k],r)); }).join(',')); }); downloadText(SCHEMA[t].label+'_전체_'+today()+'.csv',lines.join('\n')); }

boot();
